<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apresentação Oficial PGC (PDF)</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08140E;
      --navy: #08140E;
      --green: #00B022;
      --white: #FFFFFF;
      --gray: #94A3B8;
      --border: rgba(255, 255, 255, 0.1);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body, html {
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    /* Top Bar */
    .top-bar {
      height: 70px;
      background: rgba(8, 20, 14, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-inline: clamp(16px, 4vw, 40px);
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .brand img {
      height: 28px;
    }
    
    .title {
      font-size: 15px;
      font-weight: 600;
      color: var(--white);
      letter-spacing: -0.01em;
    }
    
    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .btn {
      font-size: 13.5px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn--ghost {
      border: 1px solid var(--border);
      color: var(--gray);
    }
    
    .btn--ghost:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--white);
    }
    
    .btn--primary {
      background: var(--green);
      color: var(--white);
      border: none;
    }
    
    .btn--primary:hover {
      background: #008C1B;
      transform: translateY(-1px);
    }
    
    /* Viewer */
    .viewer-container {
      flex: 1;
      width: 100%;
      background: #0f172a;
      position: relative;
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    
    @media (max-width: 768px) {
      .top-bar .title {
        display: none;
      }
    }
  </style>
</head>
<body>
  
  <header class="top-bar">
    <div class="brand">
      <img src="assets/img/logo-light.png" alt="Logo PGC">
      <span class="title">Apresentação Oficial PGC</span>
    </div>
    <div class="actions">
      <a href="index.html" class="btn btn--ghost">Voltar ao site</a>
      <a href="apresentacao.pdf" download class="btn btn--primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Baixar PDF
      </a>
    </div>
  </header>

  <main class="viewer-container">
    <iframe src="apresentacao.pdf#toolbar=0" title="Apresentação PGC PDF"></iframe>
  </main>

</body>
</html>
